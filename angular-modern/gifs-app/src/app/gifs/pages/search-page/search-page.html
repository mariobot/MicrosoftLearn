<div class="text-2xl font-bold mt-5">Search Page</div>
<div class="text-sm text-gray-500">Find your favorite GIFs!</div>

<section class="flex flex-col gap-4 mt-5">
    <div class="flex">
        <input type="text" placeholder="Search a gift..." class="w-full rounded-lg px-4 py-2 text-slate-800"
            #searchText (keyup.enter)="onSearch(searchText.value)" />
        
    </div>

    <app-gift-list [gifts]="gifs()"></app-gift-list>

</section>
