<h1>DragonBall Page</h1>

<section>
    <div class="col-12 col-sm-6">
        <dragon-character-add (newCharacter)="addCharacter($event)" ></dragon-character-add>
    </div>
    <div class="col-12 col-sm-6">
        <h3>Listado</h3>
        <dragon-character-list listName="Listado Poderoso" [characters]="characters()"></dragon-character-list>
    </div>
</section>
