<h3>Agregar {{ name() }}</h3>
<input type="text" class="form-control" placeholder="Nombre" #txtName [value]="name()"
    (change)="name.set(txtName.value)">
<h3>Power {{ power()}}</h3>
<input type="number" class="form-control mt-2" placeholder="Poder" #txtPower [value]="power()"
    (change)="power.set(txtPower.valueAsNumber)">
<button (click)="addCharacter()" class="btn btn-primary mt-2">Agregar</button>
